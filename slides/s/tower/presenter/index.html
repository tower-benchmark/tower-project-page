    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      if (window.openSlideDesktop) {
        document.documentElement.dataset.shell = 'desktop';
        if (window.openSlideDesktop.translucent) document.documentElement.dataset.translucent = '';
      }
    </script>
